<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Delivery Leleka Recovery Code</title>
    <style>
      :root {
        --color-primary: #aecf98;
      }

      html {
        background-color: white;
        text-align: center;
        font-family: "Raleway", sans-serif;
      }

      header,
      footer {
        background-color: var(--color-primary);
        margin: 50px;
      }

      main {
        background-color: var(--color-primary);
        border-radius: 20px;
        border-color: var(--color-primary);
        border-style: solid;
        border-width: 5px;
      }

      img {
        width: 100px;
      }

      .code {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 20px;
      }

      .code span {
        font-size: 50px;
        background-color: #bfbfbf;
        padding: 10px;
        border: 2px solid black;
        border-radius: 20px;
      }
    </style>
  </head>

  <body>
    <header>
      <img src="./logo.png" alt="Delivery Leleka Logo" />
      <h1>Delivery Leleka</h1>
    </header>
    <br />
    <main>
      <h2>Привіт, {USER}</h2>
      <p>
        Ми виявили, що ви намагаєтесь скинути ваш пароль. Якщо це ви, на вкладці
        Delivery Leleka, введіть цей код:
      </p>
      <div class="code">
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
        <span>5</span>
        <span>6</span>
      </div>
      <strong
        >Якщо це не ви, <a href="#">вийдіть з усіх ваших пристроїв</a>, або
        зверніться до нас <a href="#">в підтримку</a></strong
      >
    </main>
    <br />
    <footer>
      <i>З найкращими побажаннями</i>
      <br />
      <i>Команда Delivery Leleka</i>
    </footer>
  </body>
</html>
